# Concrete DeepSeek OpenAI-compatible example.
#
# This file keeps its historical filename for compatibility with existing links.
# DeepSeek is a replaceable OpenAI-compatible example, not a GA-required provider
# and not the main CLI-wrapper preset path. The recommended user-entry config
# source is quickstart-provider-neutral.yaml; this file shows how to replace
# provider-neutral PRESET_* placeholders with concrete upstreams when you want
# an explicit OpenAI + DeepSeek sample.

listen: 127.0.0.1:8080
upstream_timeout_secs: 120

upstreams:
  OPENAI_RESPONSES_EXAMPLE:
    api_root: https://api.openai.com/v1
    format: openai-responses
    provider_key_env: OPENAI_API_KEY
    surface_defaults:
      modalities:
        input: ["text"]
        output: ["text"]
      tools:
        supports_search: false
        supports_view_image: false
        apply_patch_transport: freeform
        supports_parallel_calls: false

  DEEPSEEK_OPENAI_COMPATIBLE_EXAMPLE:
    api_root: https://api.deepseek.com
    format: openai-chat-completions
    provider_key_env: DEEPSEEK_API_KEY
    surface_defaults:
      modalities:
        input: ["text"]
        output: ["text"]
      tools:
        supports_search: false
        supports_view_image: false
        apply_patch_transport: freeform
        supports_parallel_calls: false

model_aliases:
  openai-responses-example: OPENAI_RESPONSES_EXAMPLE:gpt-5.4
  deepseek-openai-compatible-example: DEEPSEEK_OPENAI_COMPATIBLE_EXAMPLE:deepseek-v4-flash
